name: Build Qwasm2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Qwasm2
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Build Qwasm2
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"

          emcc --version

          mkdir -p release

          emmake make release/ref_gles3.wasm
          emmake make release/game_baseq2.wasm
          emmake make release/index.html

      - name: Show build output
        shell: bash
        run: |
          echo "=== release/ ==="
          ls -lah release/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: qwasm2-build
          path: release/
